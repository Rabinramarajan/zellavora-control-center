<div class="p-6 space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Profile Information</h2>
    <p class="text-slate-600 dark:text-slate-400">Edit your professional profile details</p>
  </div>

  <form [formRoot]="form" class="space-y-6">
    <!-- Title -->
    <app-form-input-control
      [formField]="form.title"
      label="Title"
      placeholder="e.g., Full Stack Engineer"
      hint="Your professional title or headline"
    />

    <!-- Bio -->
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2"> Bio </label>
      <textarea
        [formField]="form.bio"
        placeholder="Tell us about yourself..."
        rows="4"
        class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
      ></textarea>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Brief professional biography</p>
    </div>

    <!-- Contact Info Grid -->
    <div class="grid md:grid-cols-2 gap-4">
      <!-- Email -->
      <app-form-input-control
        [formField]="form.email"
        type="email"
        icon="email"
        label="Email"
        placeholder="your@email.com"
      />

      <!-- Phone -->
      <app-form-input-control
        [formField]="form.phone"
        type="tel"
        icon="phone"
        label="Phone"
        placeholder="+1 (555) 123-4567"
      />

      <!-- Location -->
      <app-form-input-control
        [formField]="form.location"
        label="Location"
        placeholder="City, Country"
      />

      <!-- Website -->
      <app-form-input-control
        [formField]="form.website"
        label="Website"
        placeholder="https://yourwebsite.com"
      />
    </div>

    <!-- Social Links Grid -->
    <div class="grid md:grid-cols-3 gap-4">
      <app-form-input-control
        [formField]="form.githubUrl"
        label="GitHub"
        placeholder="https://github.com/username"
      />

      <app-form-input-control
        [formField]="form.linkedinUrl"
        label="LinkedIn"
        placeholder="https://linkedin.com/in/username"
      />

      <app-form-input-control
        [formField]="form.twitterUrl"
        label="Twitter"
        placeholder="https://twitter.com/username"
      />
    </div>

    <!-- SEO Fields -->
    <div class="border-t border-slate-200 dark:border-slate-700 pt-6">
      <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-4">SEO Metadata</h3>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
            Meta Description
          </label>
          <textarea
            [formField]="form.metaDescription"
            placeholder="Brief description for search engines"
            rows="2"
            class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
          ></textarea>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            {{ form.metaDescription().value().length }}/160 characters
          </p>
        </div>

        <app-form-input-control
          [formField]="form.metaKeywords"
          label="Meta Keywords"
          placeholder="keyword1, keyword2, keyword3"
        />
      </div>
    </div>

    <!-- Submit Button -->
    <div class="flex gap-3 pt-4">
      <button
        type="submit"
        [disabled]="portfolio.isLoading() || form().submitting()"
        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium rounded-lg transition-colors"
      >
        <span *ngIf="!portfolio.isLoading()">💾 Save Changes</span>
        <span *ngIf="portfolio.isLoading()" class="flex items-center gap-2">
          <span class="animate-spin">⏳</span>
          Saving...
        </span>
      </button>
      <button
        type="button"
        (click)="resetForm()"
        class="px-6 py-2 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 font-medium rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors"
      >
        Reset
      </button>
    </div>

    <!-- Success Message -->
    <div
      *ngIf="savedSuccessfully()"
      class="p-4 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-900 rounded-lg text-green-700 dark:text-green-300"
    >
      ✅ Profile saved successfully!
    </div>
  </form>
</div>
