<div class="role-detail">
      <header class="page-header">
        <a routerLink="/admin/roles" class="back-link">← Back to Roles</a>
        <h1>{{ isNew() ? 'New Role' : 'Edit Role' }}</h1>
      </header>

      <div class="loading" *ngIf="loading()">Loading...</div>
      <div class="error" *ngIf="error()">{{ error() }}</div>

      <form *ngIf="role() && !loading()" (ngSubmit)="onSave()" class="form">
        <fieldset class="form-group">
          <legend>Role Information</legend>
          <div class="form-row">
            <div class="form-field">
              <label>Role Name</label>
              <input type="text" [(ngModel)]="role()!.roleName" name="roleName" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label>Module</label>
              <input type="text" [(ngModel)]="role()!.moduleValue" name="module" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label>Status</label>
              <select [(ngModel)]="role()!.statusValue" name="status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset class="form-group" *ngIf="role()!.ilstRoleResource && role()!.ilstRoleResource!.length > 0">
          <legend>Resources</legend>
          <div class="resource-list">
            @for (resource of role()!.ilstRoleResource!; track resource.roleResourceId) {
              <div class="resource-item">
                <label>
                  <input type="checkbox" [checked]="true" />
                  {{ resource.permissionValue }} (ID: {{ resource.resourceId }})
                </label>
              </div>
            }
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <a routerLink="/admin/roles" class="btn btn-secondary">Cancel</a>
          <button
            type="button"
            class="btn btn-danger"
            (click)="onDelete()"
            *ngIf="!isNew()"
          >
            Delete
          </button>
        </div>
      </form>
    </div>
