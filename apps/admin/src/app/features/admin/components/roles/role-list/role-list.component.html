<div class="role-list">
  <header class="page-header">
    <h1>Roles</h1>
    <button
      *hasPermission="'admin:roles:create'"
      class="btn btn-primary"
      (click)="onCreate()"
    >
      + New Role
    </button>
  </header>

  <div class="error" *ngIf="error()">{{ error() }}</div>

  <app-table
    [rows]="roles()"
    [columns]="columns"
    [loading]="loading()"
    [trackBy]="trackBy"
    searchPlaceholder="Search roles..."
    [columnToggle]="true"
  >
    <ng-template [appCell]="'roleName'" let-role>
      <a [routerLink]="['/admin/roles', role.roleId]">
        {{ role.roleName }}
      </a>
    </ng-template>

    <ng-template [appCell]="'resources'" let-role>
      {{ role.ilstRoleResource?.length || 0 }} resources
    </ng-template>

    <ng-template [appCell]="'status'" let-role>
      <span [class]="'badge ' + (role.statusValue === 'Active' ? 'badge-active' : 'badge-inactive')">
        {{ role.statusDescription || role.statusValue }}
      </span>
    </ng-template>

    <ng-template [appCell]="'actions'" let-role>
      <div class="actions">
        <button
          *hasPermission="'admin:roles:read'"
          class="btn btn-sm btn-ghost"
          (click)="onView(role)"
        >
          View
        </button>
        <button
          *hasPermission="'admin:roles:update'"
          class="btn btn-sm btn-ghost"
          (click)="onEdit(role)"
        >
          Edit
        </button>
      </div>
    </ng-template>
  </app-table>
</div>
