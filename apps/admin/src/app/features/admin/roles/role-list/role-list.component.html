<div class="role-list">
      <header class="page-header">
        <h1>Roles</h1>
        <button
          *hasPermission="'system:rbac:write'"
          class="btn btn-primary"
          (click)="onCreate()"
        >
          + New Role
        </button>
      </header>

      <div class="filters">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearch($event)"
          placeholder="Search roles…"
          class="search-input"
        />
        <select [(ngModel)]="sortBy" (ngModelChange)="onSort($event)">
          <option value="level">Level</option>
          <option value="label">Name</option>
          <option value="isSystem">System</option>
        </select>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th></th>
            <th>Role</th>
            <th>Level</th>
            <th>Type</th>
            <th>Permissions</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (role of filtered(); track role.id) {
            <tr>
              <td>
                <span class="chip" [style.background]="role.color || '#64748b'"></span>
              </td>
              <td>
                <a [routerLink]="['/admin/roles', role.id]">{{ role.label }}</a>
                <div class="role-key">{{ role.key }}</div>
              </td>
              <td>{{ role.level }}</td>
              <td>
                @if (role.isSystem) {
                  <span class="badge badge-system">system</span>
                } @else {
                  <span class="badge badge-custom">custom</span>
                }
              </td>
              <td>{{ role.permissions?.length || '—' }}</td>
              <td>
                <button
                  *hasPermission="'system:rbac:write'"
                  class="btn btn-ghost"
                  [disabled]="role.isSystem"
                  (click)="onClone(role)"
                >Clone</button>
                <button
                  *hasPermission="'system:rbac:write'"
                  class="btn btn-ghost btn-danger"
                  [disabled]="role.isSystem"
                  (click)="onDelete(role)"
                >Delete</button>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="6" class="empty">No roles found.</td></tr>
          }
        </tbody>
      </table>
    </div>
