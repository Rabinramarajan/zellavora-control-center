<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 21h18"></path>
        <path d="M5 21V7l7-4 7 4v14"></path>
        <path d="M9 9h.01"></path>
        <path d="M9 12h.01"></path>
        <path d="M9 15h.01"></path>
        <path d="M15 9h.01"></path>
        <path d="M15 12h.01"></path>
        <path d="M15 15h.01"></path>
      </svg>
      Organization Information
    </p>
    <h2 class="step__title">Your company profile</h2>
    <p class="step__sub">Tell us about your organization.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="reg-form__body">
      <app-input-control
        formControlName="organizationName"
        label="Organization Name"
        placeholder="e.g. Acme Corp"
        prefixIcon="pi-building"
        autocomplete="organization"
        [clearable]="true"
        [trim]="true"
        [hint]="orgNamePending() ? 'Checking availability…' : ''"
      />

      <app-input-control
        formControlName="organizationCode"
        label="Organization Code"
        placeholder="e.g. acme-corp"
        prefixIcon="pi-hashtag"
        autocomplete="off"
        hint="2–16 characters: letters, numbers, hyphens only."
        (blurred)="checkOrgCode()"
      />
      <button
        type="button"
        class="text-link"
        [disabled]="!form.get('organizationName')?.value"
        (click)="generateCodeFromName()"
      >
        Generate from organization name
      </button>

      <div class="field-grid">
        <zc-select-control
          formControlName="industry"
          label="Industry"
          placeholder="Select Industry"
          prefixIcon="pi-th-large"
          [options]="industryOptions"
          optionLabel=""
        />

        <zc-select-control
          formControlName="organizationSize"
          label="Company Size"
          placeholder="Select Size"
          prefixIcon="pi-users"
          [options]="organizationSizeOptions"
          optionValue="key"
          optionLabel="label"
        />
      </div>

      <div class="field-grid">
        <zc-select-control
          formControlName="currency"
          label="Base Currency"
          placeholder="Select Currency"
          prefixIcon="pi-dollar"
          [options]="currencyOptions"
          optionValue="key"
          optionLabel="value"
        />

        <zc-select-control
          formControlName="fiscalYear"
          label="Fiscal Year"
          placeholder="Select Fiscal Year"
          prefixIcon="pi-calendar"
          [options]="fiscalYearOptions"
          optionValue="key"
          optionLabel="value"
        />
      </div>

      <zc-select-control
        formControlName="timezone"
        label="Timezone"
        placeholder="Select Timezone"
        prefixIcon="pi-clock"
        [options]="timezoneOptions"
        optionLabel=""
      />

      <app-input-control
        formControlName="website"
        type="url"
        label="Website (optional)"
        placeholder="https://example.com"
        prefixIcon="pi-globe"
        [clearable]="true"
        [trim]="true"
      />

      <div class="field">
        <label class="field__label"
          >Organization Logo <span class="field__opt">(optional)</span></label
        >
        <app-drag-drop-upload (upload)="onLogoUploaded($event)"></app-drag-drop-upload>
      </div>

      <div class="field">
        <label class="field__label">What will you use Zellavora for?</label>
        <div class="use-grid">
          @for (u of useCaseOptions; track u.value) {
            <button
              type="button"
              class="use-chip"
              [class.is-active]="isUseCaseSelected(u.value)"
              (click)="toggleUseCase(u.value)"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path [attr.d]="icons[u.icon]"></path>
              </svg>
              {{ u.label }}
              @if (isUseCaseSelected(u.value)) {
                <span class="use-chip__check">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </span>
              }
            </button>
          }
        </div>
      </div>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button
        type="submit"
        class="btn-primary"
        [disabled]="store.loading() || form.invalid || form.pending"
      >
        Continue
        <svg
          class="btn-primary__arrow"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </footer>
  </form>
</section>
