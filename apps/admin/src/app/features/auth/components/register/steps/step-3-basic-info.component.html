<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      Basic Information
    </p>
    <h2 class="step__title">Tell us about yourself</h2>
    <p class="step__sub">This is the account owner&apos;s profile for your organization.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="reg-form__body">
      <div class="field-grid">
        <app-input-control
          formControlName="firstName"
          label="First Name"
          placeholder="Alex"
          prefixIcon="pi-user"
          autocomplete="given-name"
          [clearable]="true"
          [trim]="true"
        />
        <app-input-control
          formControlName="lastName"
          label="Last Name"
          placeholder="Morgan"
          prefixIcon="pi-user"
          autocomplete="family-name"
          [clearable]="true"
          [trim]="true"
        />
      </div>

      <app-input-control
        formControlName="email"
        type="email"
        label="Work Email"
        placeholder="you@company.com"
        prefixIcon="pi-envelope"
        autocomplete="email"
        inputmode="email"
        [clearable]="true"
        [trim]="true"
        [hint]="emailPending() ? 'Checking availability…' : ''"
      />

      <app-input-control
        formControlName="mobile"
        type="tel"
        label="Mobile Number"
        placeholder="+1 (555) 000-0000"
        prefixIcon="pi-phone"
        autocomplete="tel"
        inputmode="tel"
        [clearable]="true"
      />

      <div class="field-grid">
        <zc-select-control
          formControlName="country"
          label="Country"
          placeholder="Select Country"
          prefixIcon="pi-globe"
          [options]="store.countryOptions()"
          optionLabel=""
        />

        <zc-select-control
          formControlName="language"
          label="Language"
          placeholder="Select Language"
          prefixIcon="pi-language"
          [options]="store.languageOptions()"
          optionValue="key"
          optionLabel="value"
        />

        <zc-select-control
          formControlName="gender"
          label="Gender"
          placeholder="Select Gender"
          prefixIcon="pi-user"
          [options]="store.genderOptions()"
          optionValue="key"
          optionLabel="value"
        />
      </div>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button
        type="submit"
        class="btn-primary"
        [disabled]="store.loading() || form.invalid || form.pending"
      >
        @if (store.loading()) {
          Saving…
        } @else {
          Continue
          <svg
            class="btn-primary__arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14"></path>
            <path d="M12 5l7 7-7 7"></path>
          </svg>
        }
      </button>
    </footer>
  </form>
</section>
