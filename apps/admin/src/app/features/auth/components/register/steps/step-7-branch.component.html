<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      Branch Setup
    </p>
    <h2 class="step__title">Set up your head office</h2>
    <p class="step__sub">You can add more branches after your workspace is ready.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="reg-form__body">
      <app-input-control
        formControlName="branchName"
        label="Branch Name"
        placeholder="Head Office"
        prefixIcon="pi-building"
        [clearable]="true"
        [trim]="true"
      />

      <zc-select-control
        formControlName="branchCountry"
        label="Country"
        placeholder="Select Country"
        prefixIcon="pi-globe"
        [options]="store.countryOptions()"
        optionLabel=""
      />

      <div class="field-grid">
        <app-input-control
          formControlName="branchCity"
          label="City"
          placeholder="Mumbai"
          prefixIcon="pi-building"
          [clearable]="true"
          [trim]="true"
        />
        <app-input-control
          formControlName="branchPincode"
          label="Postal Code"
          placeholder="400001"
          prefixIcon="pi-hashtag"
          [clearable]="true"
          [trim]="true"
        />
      </div>

      <app-input-control
        formControlName="branchAddress"
        label="Address"
        placeholder="12 Business District Road"
        prefixIcon="pi-map-marker"
        [clearable]="true"
        [trim]="true"
      />

      <div class="field-grid">
        <app-input-control
          formControlName="branchPhone"
          type="tel"
          label="Contact Number"
          placeholder="+1 (555) 000-0000"
          prefixIcon="pi-phone"
          inputmode="tel"
          [clearable]="true"
        />
        <app-input-control
          formControlName="branchEmail"
          type="email"
          label="Branch Email"
          placeholder="office@acme.com"
          prefixIcon="pi-envelope"
          inputmode="email"
          [clearable]="true"
          [trim]="true"
        />
      </div>

      <div class="field-grid">
        <app-input-control
          formControlName="branchLatitude"
          label="Latitude"
          placeholder="19.0760"
          prefixIcon="pi-compass"
          inputmode="decimal"
          [clearable]="true"
        />
        <app-input-control
          formControlName="branchLongitude"
          label="Longitude"
          placeholder="72.8777"
          prefixIcon="pi-compass"
          inputmode="decimal"
          [clearable]="true"
        />
      </div>

      <button
        type="button"
        class="btn-ghost btn-ghost--block"
        [disabled]="locating.value"
        (click)="useCurrentLocation()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M12 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path>
        </svg>
        {{ locating.value ? 'Locating…' : 'Use my current location' }}
      </button>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button type="submit" class="btn-primary" [disabled]="store.loading()">
        Continue
        <svg
          class="btn-primary__arrow"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </footer>
  </form>
</section>
