<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      Branch Setup
    </p>
    <h2 class="step__title">Set up your head office</h2>
    <p class="step__sub">You can add more branches after your workspace is ready.</p>
  </header>

  <form [formRoot]="form">
    <div class="reg-form__body">
      <app-form-input-control
        [formField]="form.branchName"
        label="Branch Name"
        placeholder="Head Office"
      />

      <app-select-control
        [formField]="form.branchCountry"
        label="Country"
        placeholder="Select Country"
        icon="globe"
        [searchable]="true"
        searchPlaceholder="Search country..."
        [options]="countryOptions()"
      />

      <div class="field-grid">
        <app-form-input-control [formField]="form.branchCity" label="City" placeholder="Mumbai" />
        <app-form-input-control
          [formField]="form.branchPincode"
          label="Postal Code"
          placeholder="400001"
        />
      </div>

      <app-form-input-control
        [formField]="form.branchAddress"
        label="Address"
        placeholder="12 Business District Road"
      />

      <div class="field-grid">
        <app-form-input-control
          [formField]="form.branchPhone"
          type="tel"
          icon="phone"
          label="Contact Number"
          placeholder="+1 (555) 000-0000"
        />
        <app-form-input-control
          [formField]="form.branchEmail"
          type="email"
          icon="email"
          label="Branch Email"
          placeholder="office@acme.com"
        />
      </div>

      <div class="field-grid">
        <app-form-input-control
          [formField]="form.branchLatitude"
          label="Latitude"
          placeholder="19.0760"
        />
        <app-form-input-control
          [formField]="form.branchLongitude"
          label="Longitude"
          placeholder="72.8777"
        />
      </div>

      <button
        type="button"
        class="btn-ghost btn-ghost--block"
        [disabled]="locating()"
        (click)="useCurrentLocation()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M12 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path>
        </svg>
        {{ locating() ? 'Locating…' : 'Use my current location' }}
      </button>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button type="submit" class="btn-primary" [disabled]="store.loading() || form().submitting()">
        Continue
        <svg
          class="btn-primary__arrow"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </footer>
  </form>
</section>
