<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
        <path d="M16 13H8"></path>
        <path d="M16 17H8"></path>
        <path d="M10 9H8"></path>
      </svg>
      Terms &amp; Privacy
    </p>
    <h2 class="step__title">Last few agreements</h2>
    <p class="step__sub">Review and accept our policies to continue.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="reg-form__body">
      <div class="agree-card" [class.is-error]="showError('termsAccepted')">
        <label class="agree-card__label">
          <input formControlName="termsAccepted" type="checkbox" />
          <span class="agree-card__box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </span>
          <span class="agree-card__text">
            I agree to the <a href="#" class="agree-card__link">Terms of Service</a>
            <em>*</em>
          </span>
        </label>
      </div>

      <div class="agree-card" [class.is-error]="showError('privacyAccepted')">
        <label class="agree-card__label">
          <input formControlName="privacyAccepted" type="checkbox" />
          <span class="agree-card__box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </span>
          <span class="agree-card__text">
            I agree to the <a href="#" class="agree-card__link">Privacy Policy</a> <em>*</em>
          </span>
        </label>
      </div>

      <div class="agree-card">
        <label class="agree-card__label">
          <input formControlName="cookieAccepted" type="checkbox" />
          <span class="agree-card__box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </span>
          <span class="agree-card__text">
            I accept the <a href="#" class="agree-card__link">Cookie Policy</a>
          </span>
        </label>
      </div>

      <div class="agree-card">
        <label class="agree-card__label">
          <input formControlName="securityAlertsEnabled" type="checkbox" />
          <span class="agree-card__box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </span>
          <span class="agree-card__text"> Send me security alerts </span>
        </label>
      </div>

      <div class="agree-card">
        <label class="agree-card__label">
          <input formControlName="marketingEmails" type="checkbox" />
          <span class="agree-card__box">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
          </span>
          <span class="agree-card__text"> Send me product news &amp; tips </span>
        </label>
      </div>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button type="submit" class="btn-primary" [disabled]="store.loading()">
        Continue
        <svg
          class="btn-primary__arrow"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </footer>
  </form>
</section>
