<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"
        ></path>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Password Creation
    </p>
    <h2 class="step__title">Secure your account</h2>
    <p class="step__sub">Create a strong password — at least 12 characters.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="reg-form__body">
      <app-input-control
        formControlName="password"
        type="password"
        label="Password"
        placeholder="Enter a strong password"
        prefixIcon="pi-lock"
        autocomplete="new-password"
        [errorText]="containsPersonalInfo() ? 'Password cannot contain your name or email.' : ''"
      />

      <app-input-control
        formControlName="confirmPassword"
        type="password"
        label="Confirm Password"
        placeholder="Re-enter your password"
        prefixIcon="pi-lock"
        autocomplete="new-password"
        [errorText]="passwordMismatch() ? 'Passwords do not match.' : ''"
      />

      <app-password-strength [password]="form.value.password || ''"></app-password-strength>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button
        type="submit"
        class="btn-primary"
        [disabled]="store.loading() || form.invalid"
      >
        Continue
        <svg
          class="btn-primary__arrow"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </footer>
  </form>
</section>
