<div class="tp-field" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input
    class="tp-input"
    type="text"
    inputmode="text"
    autocomplete="off"
    role="combobox"
    aria-autocomplete="list"
    [id]="inputId()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId()"
    [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [value]="text()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
  <button
    type="button"
    class="tp-toggle"
    tabindex="-1"
    [attr.aria-label]="open() ? 'Close time list' : 'Open time list'"
    [disabled]="isDisabled()"
    (mousedown)="$event.preventDefault()"
    (click)="toggle()"
  >
    <i class="pi pi-clock" aria-hidden="true"></i>
  </button>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayMinWidth]="'9.5rem'"
  (overlayOutsideClick)="open.set(false)"
  (detach)="open.set(false)"
>
  <div class="tp-panel">
    <ul #listbox class="tp-list" role="listbox" [id]="listId()" [attr.aria-label]="ariaLabel()">
      @for (option of options(); track option.minutes; let index = $index) {
        <li
          role="option"
          class="tp-option"
          [id]="optionId(index)"
          [class.tp-option-active]="index === activeIndex()"
          [attr.aria-selected]="option.label === text()"
          (mousedown)="$event.preventDefault()"
          (click)="select(option.minutes)"
          (mouseenter)="activeIndex.set(index)"
        >
          {{ option.label }}
          @if (option.label === text()) {
            <i class="pi pi-check" aria-hidden="true"></i>
          }
        </li>
      }
    </ul>
    @if (text()) {
      <button
        type="button"
        class="tp-clear"
        (mousedown)="$event.preventDefault()"
        (click)="clear(); open.set(false)"
      >
        Clear
      </button>
    }
  </div>
</ng-template>
