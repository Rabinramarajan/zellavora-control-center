@if (showAll()) {
  <ng-container
    *ngTemplateOutlet="
      chip;
      context: { $implicit: null, label: allLabel(), count: allCount(), active: allActive() }
    "
  />
}
@for (o of options(); track o.value) {
  <ng-container
    *ngTemplateOutlet="
      chip;
      context: { $implicit: o.value, label: o.label, count: o.count, active: isActive(o.value) }
    "
  />
}

<ng-template #chip let-value let-label="label" let-count="count" let-active="active">
  <button
    type="button"
    class="inline-flex min-h-[36px] cursor-pointer items-center gap-2 rounded-full border px-3 text-xs font-medium transition-colors disabled:cursor-not-allowed disabled:opacity-50"
    [class]="
      active
        ? 'border-indigo-500 bg-indigo-500/10 text-indigo-600 dark:text-indigo-300'
        : 'border-gray-200 text-gray-600 hover:bg-gray-50 dark:border-white/10 dark:text-gray-300 dark:hover:bg-white/5'
    "
    [attr.aria-pressed]="active"
    [disabled]="disabled()"
    (click)="select(value)"
  >
    {{ label }}
    @if (count !== undefined) {
      <span class="tabular-nums text-gray-400">{{ count ?? '…' }}</span>
    }
  </button>
</ng-template>
