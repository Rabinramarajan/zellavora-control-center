<button
  type="button"
  class="trigger"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [class.set]="isSet()"
  [class.open]="open()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'Date range: ' + label()"
  (click)="toggle()"
>
  <i class="pi pi-calendar" aria-hidden="true"></i>
  <span class="trigger-label">{{ label() }}</span>
  <i class="pi pi-chevron-down chevron" aria-hidden="true"></i>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
  (overlayKeydown)="onKeydown($event)"
>
  <div
    class="panel"
    role="dialog"
    aria-label="Choose date range"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <p class="section-label">Quick select</p>
    <div class="presets">
      @for (preset of presets(); track preset.id) {
        <button
          type="button"
          class="preset"
          [class.active]="activePreset() === preset.id"
          [attr.aria-pressed]="activePreset() === preset.id"
          (click)="applyPreset(preset)"
        >
          {{ preset.label }}
          @if (activePreset() === preset.id) {
            <i class="pi pi-check" aria-hidden="true"></i>
          }
        </button>
      }
    </div>

    <p class="section-label">Custom range</p>
    <div class="custom">
      <label class="field">
        <span>From</span>
        <input
          type="date"
          [class.empty]="!draftFrom()"
          [value]="draftFrom()"
          [max]="draftTo() || null"
          (change)="draftFrom.set($any($event.target).value)"
          (keydown.enter)="apply()"
        />
      </label>
      <label class="field">
        <span>To</span>
        <input
          type="date"
          [class.empty]="!draftTo()"
          [value]="draftTo()"
          [min]="draftFrom() || null"
          (change)="draftTo.set($any($event.target).value)"
          (keydown.enter)="apply()"
        />
      </label>
    </div>
    @if (draftInvalid()) {
      <p class="error" role="alert">Start date must be on or before the end date.</p>
    }

    <footer class="panel-foot">
      <button
        type="button"
        class="text-btn"
        [disabled]="!isSet() && !draftFrom() && !draftTo()"
        (click)="clear()"
      >
        Clear
      </button>
      <div class="foot-actions">
        <button type="button" class="text-btn" (click)="close()">Cancel</button>
        <button
          type="button"
          class="apply-btn"
          [disabled]="draftInvalid() || !draftChanged()"
          (click)="apply()"
        >
          Apply
        </button>
      </div>
    </footer>
  </div>
</ng-template>
