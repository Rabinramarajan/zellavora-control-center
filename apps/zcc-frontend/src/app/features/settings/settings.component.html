<p-toast />

<div class="space-y-6">
  <header class="flex items-center gap-4">
    <span
      class="w-12 h-12 rounded-2xl bg-violet-600/10 border border-violet-500/20 text-violet-300 flex items-center justify-center shrink-0"
    >
      <app-settings-icon name="cog" sizeClass="w-6 h-6" />
    </span>
    <div>
      <h1 class="text-2xl font-black text-white tracking-tight">Settings</h1>
      <p class="text-sm text-slate-400 mt-1">
        Manage your application preferences and account settings.
      </p>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <aside class="lg:col-span-3 lg:sticky lg:top-6">
      <app-settings-nav
        [tabs]="tabs"
        [activeTab]="activeTabId()"
        (tabSelect)="selectTab($event)"
      />
    </aside>

    <main class="lg:col-span-6 xl:col-span-6 min-w-0 space-y-6 settings-panel">
      @switch (activeTabId()) {
        @case ('general') {
          <app-general-settings-form
            [settings]="generalSettings()"
            [saving]="savingSection() === 'general'"
            (save)="saveGeneral($event)"
          />
        }
        @case ('profile') {
          <app-avatar-uploader
            [avatarUrl]="avatarUrl()"
            [name]="profileSettings().fullName"
            [email]="profileSettings().email"
            [role]="userRole()"
            [busy]="avatarSaving()"
            (avatarChange)="updateAvatar($event)"
            (avatarRemove)="updateAvatar(null)"
          />

          <app-profile-settings-form
            [settings]="profileSettings()"
            [saving]="savingSection() === 'profile'"
            (save)="saveProfile($event)"
          />
        }
        @default {
          <app-settings-card
            [heading]="activeTab().label"
            headingId="placeholder-heading"
            [description]="activeTab().description"
          >
            <div class="py-14 flex flex-col items-center text-center gap-3">
              <span
                class="w-12 h-12 rounded-2xl bg-white/[0.04] text-slate-400 flex items-center justify-center"
              >
                <app-settings-icon [name]="activeTab().icon" sizeClass="w-6 h-6" />
              </span>
              <p class="text-sm font-semibold text-slate-200">Coming soon</p>
              <p class="text-xs text-slate-400 max-w-xs">
                {{ activeTab().label }} settings aren't available yet.
              </p>
            </div>
          </app-settings-card>
        }
      }
    </main>

    <div class="lg:col-span-3">
      <app-settings-aside
        [mfaEnabled]="mfaEnabled()"
        [storageUsedGb]="24.3"
        [storageTotalGb]="50"
        [systemInfo]="systemInfo"
        (manageSecurity)="openSecurity()"
      />
    </div>
  </div>
</div>
