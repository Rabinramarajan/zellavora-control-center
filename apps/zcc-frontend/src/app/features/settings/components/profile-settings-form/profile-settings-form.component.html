<app-settings-card
  heading="Personal information"
  headingId="profile-settings-heading"
  description="How you appear to teammates across the workspace."
  [showSave]="true"
  [saving]="saving()"
  [dirty]="dirty()"
  (save)="save.emit(draft())"
  (reset)="draft.set(settings())"
>
  <div class="py-6 grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-5">
    <app-form-input-control
      type="text"
      icon="user"
      label="Full name"
      [value]="draft().fullName"
      (valueChange)="patch({ fullName: $event })"
    />
    <app-form-input-control
      type="email"
      icon="email"
      label="Email address"
      [value]="draft().email"
      (valueChange)="patch({ email: $event })"
    />
    <app-form-input-control
      type="tel"
      icon="phone"
      label="Phone"
      [value]="draft().phone"
      (valueChange)="patch({ phone: $event })"
    />
    <app-form-input-control
      type="text"
      label="Location"
      [value]="draft().location"
      (valueChange)="patch({ location: $event })"
    />

    <div class="md:col-span-2">
      <div class="flex items-baseline justify-between mb-2">
        <label for="profile-bio" class="text-xs font-semibold text-slate-200">Biography</label>
        <span
          class="text-[11px] tabular-nums"
          [class]="draft().bio.length > bioMax * 0.9 ? 'text-amber-300' : 'text-slate-500'"
        >
          {{ draft().bio.length }}/{{ bioMax }}
        </span>
      </div>
      <textarea
        id="profile-bio"
        rows="4"
        [maxLength]="bioMax"
        [value]="draft().bio"
        (input)="patch({ bio: $any($event.target).value })"
        placeholder="A short introduction about yourself"
        class="w-full resize-none bg-slate-900/50 border border-white/10 text-slate-200 text-sm leading-relaxed rounded-xl px-4 py-3 placeholder:text-slate-600 transition-colors duration-200 focus:outline-none focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20"
      ></textarea>
    </div>
  </div>
</app-settings-card>
