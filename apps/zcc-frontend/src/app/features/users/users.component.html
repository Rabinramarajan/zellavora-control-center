<section class="relative flex flex-1 flex-col md:min-h-0">
  <zcc-iam-page-header title="User" icon="pi pi-users">
    <div class="filter-anchor relative">
      <button
        type="button"
        [class]="btn.secondary"
        aria-haspopup="dialog"
        aria-controls="us-filter-popup"
        [attr.aria-expanded]="filtersOpen()"
        (click)="toggleFilters()"
      >
        <i class="pi pi-filter text-xs" aria-hidden="true"></i>
        Filter
        @if (activeFilterCount() > 0) {
          <span
            class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-indigo-500 px-1.5 text-xs font-semibold text-white"
            [attr.aria-label]="activeFilterCount() + ' filters active'"
            >{{ activeFilterCount() }}</span
          >
        }
      </button>

      @if (filtersOpen()) {
        <form
          role="dialog"
          aria-labelledby="us-filter-title"
          id="us-filter-popup"
          class="us-dialog"
          (click)="$event.stopPropagation()"
          (submit)="$event.preventDefault(); search()"
        >
          <div class="us-dialog-head">
            <h2 id="us-filter-title">Filter</h2>
            <button
              type="button"
              [class]="btn.icon"
              aria-label="Close filter"
              (click)="filtersOpen.set(false)"
            >
              <i class="pi pi-times" aria-hidden="true"></i>
            </button>
          </div>

          <div class="us-dialog-body">
            <app-form-input-control
              label="First Name"
              [value]="draft().firstName"
              (valueChange)="patch('firstName', $event)"
            />
            <app-date-control
              label="Begin Date From"
              [maxDate]="draft().beginTo || undefined"
              [value]="draft().beginFrom"
              (valueChange)="patch('beginFrom', $event)"
            />
            <app-form-input-control
              label="Contact No"
              type="tel"
              [value]="draft().mobile"
              (valueChange)="patch('mobile', $event)"
            />
            <app-date-control
              label="Begin Date To"
              [minDate]="draft().beginFrom || undefined"
              [value]="draft().beginTo"
              (valueChange)="patch('beginTo', $event)"
            />
            <app-form-input-control
              label="Email ID"
              [value]="draft().email"
              (valueChange)="patch('email', $event)"
            />
            <app-date-control
              label="End Date From"
              [maxDate]="draft().endTo || undefined"
              [value]="draft().endFrom"
              (valueChange)="patch('endFrom', $event)"
            />
            <app-form-input-control
              label="Employee Code"
              [value]="draft().employeeCode"
              (valueChange)="patch('employeeCode', $event)"
            />
            <app-date-control
              label="End Date To"
              [minDate]="draft().endFrom || undefined"
              [value]="draft().endTo"
              (valueChange)="patch('endTo', $event)"
            />
            <app-select-control
              label="Group"
              [options]="groupOptions()"
              [value]="draft().groupId"
              (valueChange)="patch('groupId', $event)"
            />
            <app-select-control
              label="Status"
              [searchable]="false"
              [options]="statusOptions"
              [value]="draft().status"
              (valueChange)="patch('status', $event)"
            />
          </div>

          <div class="us-dialog-foot">
            <button type="button" [class]="btn.secondary" (click)="clear()">Clear</button>
            <button type="submit" [class]="btn.primary">Search</button>
          </div>
        </form>
      }
    </div>
  </zcc-iam-page-header>

  <app-data-table
    entityLabel="users"
    errorTitle="Failed to load users"
    [rows]="store.items()"
    [columns]="columns"
    [trackBy]="userId"
    [rowLabel]="userName"
    minWidth="900px"
    [loading]="store.loading()"
    [error]="store.error()"
    [total]="store.total()"
    [page]="store.page()"
    [pageSize]="store.pageSize()"
    [pageSizeOptions]="pageSizes"
    [sort]="sort()"
    (sortChange)="onSort($event)"
    (paginate)="onPaginate($event)"
    (retry)="store.reload()"
  >
    <ng-template dtCell="fullName" let-user>
      <a [routerLink]="['/iam/users', user.id]" class="us-link">{{ user.fullName }}</a>
    </ng-template>

    <ng-template dtEmpty>
      <div class="flex flex-col items-center gap-3 py-16 text-center">
        <p class="font-semibold text-gray-900 dark:text-white">No users match your search</p>
        <button type="button" [class]="btn.secondary" (click)="clear()">Clear filters</button>
      </div>
    </ng-template>
  </app-data-table>
</section>
