<zcc-iam-page-header
  title="Resources"
  icon="pi pi-database"
  description="Protected entitlements — each action maps to a permission key."
>
  @if (canManage()) {
    <button type="button" [class]="btn.primary" (click)="create()">
      <i class="pi pi-plus text-xs" aria-hidden="true"></i>
      New Resource
    </button>
  }
</zcc-iam-page-header>

<div class="mb-4">
  <zcc-filter-bar
    [query]="query()"
    [filters]="filters()"
    [selected]="selectedFilters()"
    (search)="onSearch($event)"
    (filtersChange)="onFiltersChange($event)"
    (resetClicked)="onReset()"
  />
</div>

@if (store.loading()) {
  <div class="space-y-2">
    @for (_ of [1, 2, 3, 4, 5]; track $index) {
      <div class="h-12 animate-pulse rounded-xl bg-gray-100 dark:bg-white/5"></div>
    }
  </div>
} @else if (store.error()) {
  <zcc-empty-state
    icon="pi pi-exclamation-triangle"
    title="Failed to load resources"
    [message]="store.error()!"
  />
} @else if (store.hasItems()) {
  <app-data-table
    [columns]="columns"
    [rows]="store.items()"
    [rowClickable]="true"
    (rowClick)="onRowClick($event)"
    [paginated]="false"
  >
    <ng-template dtCell="name" let-r>
      <a
        [routerLink]="['/iam/resources', r.id]"
        class="font-medium text-indigo-600 dark:text-indigo-400 hover:underline"
        (click)="$event.stopPropagation()"
      >
        {{ r.name }}
      </a>
      <p class="text-xs text-gray-400 font-mono">{{ r.key }}</p>
    </ng-template>

    <ng-template dtCell="type" let-r>
      <zcc-status-chip [value]="r.type" [label]="r.typeLabel" />
    </ng-template>

    <ng-template dtCell="category" let-r>
      <div class="text-gray-600 dark:text-gray-300">
        {{ r.category ?? '—' }}
      </div>
    </ng-template>

    <ng-template dtCell="actionCount" let-r>
      <div class="text-gray-600 dark:text-gray-300">
        <span class="tabular-nums">{{ r.actionCount }}</span>
      </div>
    </ng-template>

    <ng-template dtCell="status" let-r>
      <zcc-status-chip [value]="r.status" [label]="r.status === 'ACTIVE' ? 'Active' : 'Inactive'" />
    </ng-template>
  </app-data-table>

  <app-pagination
    class="px-1 py-3"
    [totalItems]="store.total()"
    [page]="store.page()"
    [pageSize]="store.pageSize()"
    (paginate)="onPaginate($event)"
  />
} @else {
  <zcc-empty-state
    icon="pi pi-database"
    title="No resources found"
    message="Try adjusting your search or create a new resource."
  />
}
