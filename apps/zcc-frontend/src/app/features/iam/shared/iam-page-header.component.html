<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
  <div class="min-w-0">
    <h1 class="flex items-center gap-2 text-xl font-bold text-gray-900 dark:text-white">
      @if (icon()) {
        <i [class]="icon()" class="text-indigo-500" aria-hidden="true"></i>
      }
      {{ title() }}
    </h1>
    @if (description()) {
      <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">{{ description() }}</p>
    }
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <ng-content />
  </div>
</div>
