<section class="relative flex flex-1 flex-col md:min-h-0">
  <zcc-iam-page-header
    title="Roles"
    icon="pi pi-shield"
    description="Roles bundle permissions. Users receive them directly or through their groups."
  >
    <div class="filter-anchor relative">
      <button
        type="button"
        [class]="btn.secondary"
        aria-haspopup="dialog"
        aria-controls="rl-filter-popup"
        [attr.aria-expanded]="filtersOpen()"
        (click)="toggleFilters()"
      >
        <i class="pi pi-filter text-xs" aria-hidden="true"></i>
        Filter
        @if (activeFilterCount() > 0) {
          <span
            class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-indigo-500 px-1.5 text-xs font-semibold text-white"
            [attr.aria-label]="activeFilterCount() + ' filters active'"
            >{{ activeFilterCount() }}</span
          >
        }
      </button>

      @if (filtersOpen()) {
        <form
          id="rl-filter-popup"
          role="dialog"
          aria-labelledby="rl-filter-title"
          class="gl-popup"
          (click)="$event.stopPropagation()"
          (submit)="$event.preventDefault(); search()"
        >
          <div class="gl-popup-head">
            <h2 id="rl-filter-title">Filter</h2>
            <button
              type="button"
              [class]="btn.icon"
              aria-label="Close filter"
              (click)="filtersOpen.set(false)"
            >
              <i class="pi pi-times" aria-hidden="true"></i>
            </button>
          </div>

          <div class="gl-popup-body">
            <app-form-input-control
              class="sm:col-span-2"
              label="Role Name / Key / Description"
              icon="search"
              placeholder="Search roles…"
              [value]="draft().q"
              (valueChange)="patch('q', $event)"
            />
            <app-select-control
              label="Scope"
              [searchable]="false"
              [options]="scopeOptions"
              [value]="draft().scope"
              (valueChange)="patch('scope', $event)"
            />
            <app-select-control
              label="Status"
              [searchable]="false"
              [options]="statusOptions"
              [value]="draft().status"
              (valueChange)="patch('status', $event)"
            />
          </div>

          <div class="gl-popup-foot">
            <button type="button" [class]="btn.secondary" (click)="clear()">Clear</button>
            <button type="submit" [class]="btn.primary">Search</button>
          </div>
        </form>
      }
    </div>

    @if (canManage()) {
      <button type="button" [class]="btn.primary" (click)="createRole()">
        <i class="pi pi-plus text-xs" aria-hidden="true"></i>
        New Role
      </button>
    }
  </zcc-iam-page-header>

  <app-filter-chips
    class="mb-4"
    ariaLabel="Roles by status"
    allLabel="All Roles"
    [allCount]="totalCount()"
    [options]="statusChips()"
    [selected]="activeStatus()"
    (selectedChange)="onStatusChip($event)"
  />

  <app-data-table
    entityLabel="roles"
    errorTitle="Failed to load roles"
    [rows]="store.items()"
    [columns]="columns"
    [trackBy]="roleId"
    [rowLabel]="roleName"
    minWidth="960px"
    [loading]="store.loading()"
    [error]="store.error()"
    [total]="store.total()"
    [page]="store.page()"
    [pageSize]="store.pageSize()"
    [pageSizeOptions]="pageSizes"
    [sort]="sort()"
    (sortChange)="onSort($event)"
    (paginate)="onPaginate($event)"
    (retry)="store.reload()"
  >
    <ng-template dtCell="name" let-r>
      <a [routerLink]="['/iam/roles', r.id]" class="gl-link">{{ r.name }}</a>
      @if (r.isSystem) {
        <span class="ms-2 text-xs text-gray-400">System</span>
      }
    </ng-template>

    <ng-template dtCell="scope" let-r>
      <zcc-status-chip
        [value]="r.scope"
        [label]="scopeLabel(r.scope)"
        [tone]="scopeTone(r.scope)"
      />
    </ng-template>

    <ng-template dtCell="status" let-r>
      <zcc-status-chip
        [value]="r.status"
        [label]="statusLabel(r.status)"
        [tone]="r.status === 'ACTIVE' ? 'green' : 'gray'"
      />
    </ng-template>

    <ng-template dtEmpty>
      <div class="flex flex-col items-center gap-3 py-16 text-center">
        <i class="pi pi-shield text-2xl text-indigo-400" aria-hidden="true"></i>
        <p class="font-semibold text-gray-900 dark:text-white">No roles found</p>
        @if (activeFilterCount() > 0) {
          <button type="button" [class]="btn.secondary" (click)="clear()">Clear filters</button>
        } @else if (canManage()) {
          <p class="text-sm text-gray-500 dark:text-gray-400">Create a role to get started.</p>
        }
      </div>
    </ng-template>
  </app-data-table>
</section>
