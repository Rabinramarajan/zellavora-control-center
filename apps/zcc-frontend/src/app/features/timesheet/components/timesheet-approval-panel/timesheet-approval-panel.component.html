<section
  *hasPermission="'timesheet:approve'"
  class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900"
>
  <header class="mb-3 flex items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold">Approval</h2>
      <p class="text-sm text-gray-600 dark:text-gray-400">{{ subtitle() }}</p>
    </div>
  </header>

  @if (isPending()) {
    <div class="space-y-3">
      <label class="block text-sm font-medium" for="rejection-reason">
        Reason (required to reject)
      </label>
      <textarea
        pTextarea
        id="rejection-reason"
        rows="3"
        class="w-full"
        [(ngModel)]="reason"
        [disabled]="busy()"
        placeholder="Explain what needs to change before this can be approved"
      ></textarea>

      <div class="flex flex-wrap gap-2">
        <button
          type="button"
          class="ts-button ts-button-approve"
          [disabled]="busy()"
          (click)="approve()"
        >
          <i
            class="pi"
            [class.pi-spin]="busy()"
            [class.pi-spinner]="busy()"
            [class.pi-check]="!busy()"
            aria-hidden="true"
          ></i>
          <span>{{ busy() ? 'Approving' : 'Approve timesheet' }}</span>
        </button>
        <button
          type="button"
          class="ts-button ts-button-danger"
          [disabled]="busy() || !reason().trim()"
          (click)="reject()"
        >
          <i class="pi pi-replay" aria-hidden="true"></i><span>Request changes</span>
        </button>
      </div>
    </div>
  } @else {
    <p class="text-sm text-gray-600 dark:text-gray-400">{{ idleMessage() }}</p>
  }
</section>
