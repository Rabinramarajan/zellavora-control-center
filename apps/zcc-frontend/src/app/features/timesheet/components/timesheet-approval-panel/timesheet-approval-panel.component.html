<section
  *hasPermission="'timesheet:approve'"
  class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900"
>
  <header class="mb-3 flex items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold">Approval</h2>
      <p class="text-sm text-gray-600 dark:text-gray-400">{{ subtitle() }}</p>
    </div>
  </header>

  @if (isPending()) {
    <div class="space-y-3">
      <label class="block text-sm font-medium" for="rejection-reason">
        Reason (required to reject)
      </label>
      <textarea
        pTextarea
        id="rejection-reason"
        rows="3"
        class="w-full"
        [(ngModel)]="reason"
        [disabled]="busy()"
        placeholder="Explain what needs to change before this can be approved"
      ></textarea>

      <div class="flex flex-wrap gap-2">
        <p-button
          label="Approve"
          severity="success"
          [disabled]="busy()"
          (onClick)="approve()"
        />
        <p-button
          label="Reject"
          severity="danger"
          [outlined]="true"
          [disabled]="busy() || !reason().trim()"
          (onClick)="reject()"
        />
      </div>
    </div>
  } @else {
    <p class="text-sm text-gray-600 dark:text-gray-400">{{ idleMessage() }}</p>
  }
</section>
