<div class="preview-toolbar" role="toolbar" aria-label="Export actions">
  <div class="preview-file">
    <i class="pi pi-file" aria-hidden="true"></i>
    <span>{{ report().fileBaseName }}</span>
  </div>
  <div class="preview-actions">
    <button
      type="button"
      class="ts-button ts-button-primary"
      [disabled]="!!busy()"
      (click)="run('pdf')"
    >
      <i
        class="pi"
        [class.pi-spin]="busy() === 'pdf'"
        [class.pi-spinner]="busy() === 'pdf'"
        [class.pi-file-pdf]="busy() !== 'pdf'"
        aria-hidden="true"
      ></i>
      <span>{{ busy() === 'pdf' ? 'Preparing' : 'Download PDF' }}</span>
    </button>
    <button
      type="button"
      class="ts-button ts-button-secondary"
      [disabled]="!!busy()"
      (click)="run('docx')"
    >
      <i
        class="pi"
        [class.pi-spin]="busy() === 'docx'"
        [class.pi-spinner]="busy() === 'docx'"
        [class.pi-file-word]="busy() !== 'docx'"
        aria-hidden="true"
      ></i>
      <span>{{ busy() === 'docx' ? 'Preparing' : 'Download Word' }}</span>
    </button>
    <button
      type="button"
      class="ts-button ts-button-secondary"
      [disabled]="!!busy()"
      (click)="run('print')"
    >
      <i class="pi pi-print" aria-hidden="true"></i><span>Print</span>
    </button>
    <button
      type="button"
      class="ts-button ts-button-quiet"
      [disabled]="!!busy()"
      (click)="run('csv')"
    >
      <i class="pi pi-table" aria-hidden="true"></i><span>CSV</span>
    </button>
  </div>
</div>

@if (report().warnings.length) {
  <div class="preview-warnings" role="status">
    <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
    <div>
      <strong>Check before sending</strong>
      <ul>
        @for (warning of report().warnings; track $index) {
          <li>{{ warning }}</li>
        }
      </ul>
    </div>
  </div>
}

<div class="preview-paper">
  <iframe
    title="Timesheet preview"
    sandbox=""
    [srcdoc]="document()"
  ></iframe>
</div>
