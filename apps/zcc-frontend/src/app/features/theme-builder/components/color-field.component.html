@if (variant() === 'tile') {
  <div class="cf-tile" [class.is-invalid]="!!error()">
    <span class="cf-tile-label" [id]="id + '-label'">{{ label() }}</span>
    <label class="cf-swatch cf-tile-swatch" [style.background]="swatch()">
      <input
        type="color"
        class="cf-native"
        [attr.aria-labelledby]="id + '-label'"
        [disabled]="disabled()"
        [value]="swatch()"
        (input)="onPick($event)"
      />
    </label>
    <input
      class="cf-tile-hex"
      spellcheck="false"
      maxlength="7"
      [attr.aria-label]="label() + ' hex value'"
      [attr.aria-invalid]="!!error()"
      [title]="error() ?? ''"
      [readOnly]="disabled()"
      [value]="value()"
      (change)="onType($event)"
    />
  </div>
} @else {
  <div>
    <label class="cf-label" [for]="id">{{ label() }}</label>
    <div class="cf-control" [class.is-invalid]="!!error()" [class.is-disabled]="disabled()">
      <label class="cf-swatch" [style.background]="swatch()">
        <input
          type="color"
          class="cf-native"
          [attr.aria-label]="label() + ' picker'"
          [disabled]="disabled()"
          [value]="swatch()"
          (input)="onPick($event)"
        />
      </label>
      <input
        class="cf-hex"
        spellcheck="false"
        maxlength="7"
        [id]="id"
        [attr.aria-invalid]="!!error()"
        [attr.aria-describedby]="error() ? id + '-err' : null"
        [readOnly]="disabled()"
        [value]="value()"
        (change)="onType($event)"
      />
      @if (canSample && !disabled()) {
        <button
          type="button"
          class="cf-dropper"
          [attr.aria-label]="'Pick ' + label() + ' from screen'"
          title="Pick from screen"
          (click)="sample()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="m2 22 1-1h3l9-9M3 21v-3l9-9m3 6 6-6a2.12 2.12 0 1 0-3-3l-6 6m-1-2 6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      }
    </div>
    @if (error()) {
      <p class="cf-error" [id]="id + '-err'">{{ error() }}</p>
    }
  </div>
}
