<section class="space-y-6 p-6">
  <header class="space-y-2">
    <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Audit Logs</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Review user activity and important system changes.
        </p>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-3">
        @if (canExport()) {
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition-colors hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500 disabled:opacity-50"
            [disabled]="exporting() || loading()"
            (click)="exportCurrentResults()"
          >
            <i class="pi pi-download text-xs" [class.animate-bounce]="exporting()" aria-hidden="true"></i>
            <span>{{ exporting() ? 'Exporting CSV...' : 'Export' }}</span>
          </button>
        }
      </div>
    </div>
  </header>

  <!-- Error Alert with Retry -->
  @if (error()) {
    <div class="rounded-xl border border-rose-200 bg-rose-50/70 p-4 text-sm text-rose-800 dark:border-rose-500/20 dark:bg-rose-500/10 dark:text-rose-300">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <i class="pi pi-exclamation-circle text-lg" aria-hidden="true"></i>
          <div>
            <p class="font-semibold">{{ error() }}</p>
            <p class="text-xs text-rose-600 dark:text-rose-400">Unable to load audit logs. Please retry.</p>
          </div>
        </div>
        <button
          type="button"
          class="rounded-lg bg-rose-600 px-3 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-rose-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-rose-500"
          (click)="executeSearch()"
        >
          Retry
        </button>
      </div>
    </div>
  }

  <!-- Search Filter Component -->
  <zcc-audit-filter
    [options]="filterOptions()"
    (searchSubmit)="onFilterSubmit($event)"
    (resetFilters)="onFilterReset()"
  />

  <!-- Audit Table Component with Server-Side Paging & Sorting -->
  <zcc-audit-table
    [logs]="logs()"
    [loading]="loading()"
    [currentSort]="sort()"
    [page]="page()"
    [size]="size()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)"
    (sizeChange)="onSizeChange($event)"
    (viewDetails)="openDetails($event)"
  />
</section>
