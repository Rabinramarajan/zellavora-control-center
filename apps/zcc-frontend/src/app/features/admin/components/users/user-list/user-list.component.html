<div class="user-list">
  <header class="page-header">
    <h1>Users</h1>
    <button *hasPermission="'admin:users:create'" class="btn btn-primary" (click)="onCreate()">
      + New User
    </button>
  </header>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <app-data-table
    mode="client"
    [searchable]="true"
    [rows]="filteredUsers()"
    [columns]="columns"
    [loading]="loading()"
    [trackBy]="trackBy"
    searchPlaceholder="Search by name, email, or employee code..."
  >
    <div toolbar-start>
      <app-select-control
        class="status-filter"
        aria-label="Filter by status"
        placeholder="All Statuses"
        [options]="statusFilterOptions"
        [value]="statusFilter()"
        (valueChange)="onStatusFilterChange($event)"
      />
    </div>

    <ng-template dtCell="fullName" let-user>
      <a [routerLink]="['/admin/users', user.userSerialId]">
        {{ user.firstName }} {{ user.lastName }}
      </a>
    </ng-template>

    <ng-template dtCell="status" let-user>
      <span [class]="'badge badge-' + (user.statusValue || 'unknown').toLowerCase()">
        {{ user.statusDescription || user.statusValue }}
      </span>
    </ng-template>

    <ng-template dtCell="actions" let-user>
      <div class="actions">
        <button
          *hasPermission="'admin:users:read'"
          class="btn btn-sm btn-ghost"
          (click)="onView(user)"
        >
          View
        </button>
        <button
          *hasPermission="'admin:users:update'"
          class="btn btn-sm btn-ghost"
          (click)="onEdit(user)"
        >
          Edit
        </button>
      </div>
    </ng-template>
  </app-data-table>
</div>
