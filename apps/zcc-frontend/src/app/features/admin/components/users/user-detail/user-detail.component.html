<div class="user-detail">
  <header class="page-header">
    <a routerLink="/admin/users" class="back-link">← Back to Users</a>
    <h1>{{ isNew() ? 'New User' : 'Edit User' }}</h1>
  </header>

  @if (loading()) {
    <div class="loading">Loading...</div>
  }
  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  @if (user() && !loading()) {
    <form [formRoot]="form" class="form">
      <fieldset class="form-group">
        <legend>Basic Information</legend>
        <div class="form-row">
          <app-form-input-control [formField]="form.userLoginId" label="Login ID" icon="user" />
          <app-form-input-control [formField]="form.firstName" label="First Name" />
          <app-form-input-control [formField]="form.lastName" label="Last Name" />
        </div>
        <div class="form-row">
          <app-form-input-control
            [formField]="form.emailId"
            type="email"
            icon="email"
            label="Email"
          />
          <app-form-input-control [formField]="form.employeeCode" label="Employee Code" />
        </div>
      </fieldset>
      <fieldset class="form-group">
        <legend>Status</legend>
        <div class="form-row">
          <app-select-control
            [formField]="form.statusValue"
            label="Status"
            [options]="statusOptions"
          />
          <app-form-input-control [formField]="form.departmentDescription" label="Department" />
        </div>
      </fieldset>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="form().submitting()">Save</button>
        <a routerLink="/admin/users" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  }
</div>
