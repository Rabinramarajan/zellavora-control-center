@if (hasData()) {
  <div class="donut-container" [style.width.px]="size()" [style.height.px]="size()">
    <svg [attr.viewBox]="'0 0 ' + size() + ' ' + size()" class="donut-svg" role="img" [attr.aria-label]="ariaLabel()">
      @for (path of paths(); track path.name) {
        <circle
          [attr.cx]="size() / 2"
          [attr.cy]="size() / 2"
          [attr.r]="path.radius"
          [attr.stroke]="path.color"
          [attr.stroke-width]="path.strokeWidth"
          [attr.stroke-dasharray]="path.circumference"
          [attr.stroke-dashoffset]="path.offset"
          [attr.stroke-linecap]="'round'"
          fill="none"
          class="donut-slice"
          style="transform: rotate(-90deg); transform-origin: center;"
        />
      }

      <!-- Center content -->
      @if (centerLabel() || centerValue()) {
        <text
          [attr.x]="size() / 2"
          [attr.y]="size() / 2 - 4"
          class="center-label"
          text-anchor="middle"
          dominant-baseline="middle"
        >
          {{ centerValue() }}
        </text>
        @if (centerLabel()) {
          <text
            [attr.x]="size() / 2"
            [attr.y]="size() / 2 + 18"
            class="center-sublabel"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            {{ centerLabel() }}
          </text>
        }
      }
    </svg>
  </div>
} @else {
  <div class="donut-empty" [style.width.px]="size()" [style.height.px]="size()">
    <div class="empty-state">No data</div>
  </div>
}

<!-- Legend -->
<div class="donut-legend" role="list" aria-label="Chart legend">
  @for (slice of slices(); track slice.name) {
    <div class="legend-item" style="--legend-color: {{ slice.color }}">
      <span class="legend-swatch"></span>
      <span class="legend-label">{{ slice.name }}</span>
      <span class="legend-value">{{ slice.value.toLocaleString() }}</span>
      <span class="legend-percentage">({{ (slice.value / total()) * 100 | number:'1.0-0' }}%)</span>
    </div>
  }
</div>
