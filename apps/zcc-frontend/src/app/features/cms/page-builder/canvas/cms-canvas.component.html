<div
  class="canvas-root"
  [attr.data-device]="device()"
  (click)="deselect()"
>
  <div class="canvas-frame">
    @if (sections().length === 0) {
      <div class="canvas-empty">
        <div class="canvas-empty-icon" aria-hidden="true">
          <i class="pi pi-objects-column text-2xl"></i>
        </div>
        <p class="canvas-empty-title">Your page is empty</p>
        <p class="canvas-empty-hint">Add components from the library on the left.</p>
      </div>
    } @else {
      @for (section of sections(); track section.id; let first = $first; let last = $last; let idx = $index) {
        <div
          class="canvas-section"
          [class.is-selected]="selectedId() === section.id"
          [class.is-hovered]="hoveredId() === section.id && selectedId() !== section.id"
          (click)="select(section); $event.stopPropagation()"
          (mouseenter)="hoveredId.set(section.id)"
          (mouseleave)="hoveredId.set(null)"
          [attr.data-type]="section.type"
          [attr.aria-selected]="selectedId() === section.id"
          role="button"
          tabindex="0"
          (keydown.enter)="select(section)"
          (keydown.space)="select(section); $event.preventDefault()"
        >
          <!-- Section header / controls -->
          <div class="canvas-section-controls" (click)="$event.stopPropagation()">
            <span class="canvas-section-type">{{ section.type }}</span>
            <span class="canvas-section-title">{{ section.title }}</span>
            <div class="canvas-section-actions">
              <button
                type="button"
                class="canvas-ctrl-btn"
                title="Move up"
                [disabled]="first"
                (click)="move(section.id, 'up', $event)"
                aria-label="Move section up"
              >
                <i class="pi pi-angle-up" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="canvas-ctrl-btn"
                title="Move down"
                [disabled]="last"
                (click)="move(section.id, 'down', $event)"
                aria-label="Move section down"
              >
                <i class="pi pi-angle-down" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="canvas-ctrl-btn"
                title="Duplicate"
                (click)="duplicate(section.id, $event)"
                aria-label="Duplicate section"
              >
                <i class="pi pi-copy" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="canvas-ctrl-btn is-danger"
                title="Remove"
                (click)="remove(section.id, $event)"
                aria-label="Remove section"
              >
                <i class="pi pi-trash" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <!-- Section preview -->
          <div class="canvas-section-preview">
            <app-cms-section-preview [section]="section" />
          </div>
        </div>
      }
    }
  </div>
</div>
