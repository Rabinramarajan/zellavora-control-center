<div class="settings-root">
  <!-- General -->
  <div class="settings-section">
    <h3 class="settings-group-title">General</h3>

    <div class="settings-field">
      <label class="settings-label" for="set-title">Page Title</label>
      <input id="set-title" type="text" [class]="inputClass" [value]="page().title" (input)="set('title', $any($event.target).value)" />
    </div>

    <div class="settings-field">
      <label class="settings-label" for="set-slug">Slug</label>
      <input id="set-slug" type="text" [class]="inputClass" [value]="page().slug" (input)="set('slug', $any($event.target).value)" />
    </div>
  </div>

  <!-- SEO -->
  <div class="settings-section">
    <h3 class="settings-group-title">SEO</h3>

    <div class="settings-field">
      <label class="settings-label" for="set-seo-title">
        SEO Title
        <span class="settings-char-count" [class.over]="seoTitleLen() > 60">{{ seoTitleLen() }}/70</span>
      </label>
      <input
        id="set-seo-title"
        type="text"
        [class]="inputClass"
        [value]="page().seo?.seoTitle ?? ''"
        (input)="setSeo('seoTitle', $any($event.target).value)"
        maxlength="70"
        placeholder="Defaults to page title"
      />
    </div>

    <div class="settings-field">
      <label class="settings-label" for="set-meta-desc">
        Meta Description
        <span class="settings-char-count" [class.over]="metaDescLen() > 155">{{ metaDescLen() }}/160</span>
      </label>
      <textarea
        id="set-meta-desc"
        class="settings-textarea"
        [value]="page().seo?.metaDescription ?? ''"
        (input)="setSeo('metaDescription', $any($event.target).value)"
        rows="3"
        maxlength="160"
        placeholder="Brief description for search engines"
      ></textarea>
    </div>

    <div class="settings-field">
      <label class="settings-label" for="set-canonical">Canonical URL</label>
      <input id="set-canonical" type="url" [class]="inputClass" [value]="page().seo?.canonicalUrl ?? ''" (input)="setSeo('canonicalUrl', $any($event.target).value)" placeholder="https://…" />
    </div>

    <div class="settings-field">
      <label class="settings-label" for="set-robots">Robots</label>
      <select id="set-robots" [class]="inputClass" [value]="page().seo?.robots ?? 'index, follow'" (change)="setSeo('robots', $any($event.target).value)">
        <option value="index, follow">index, follow (default)</option>
        <option value="noindex, follow">noindex, follow</option>
        <option value="index, nofollow">index, nofollow</option>
        <option value="noindex, nofollow">noindex, nofollow</option>
      </select>
    </div>
  </div>

  <!-- Open Graph -->
  <div class="settings-section">
    <h3 class="settings-group-title">Open Graph</h3>

    <div class="settings-field">
      <label class="settings-label" for="set-og-title">OG Title</label>
      <input id="set-og-title" type="text" [class]="inputClass" [value]="page().seo?.ogTitle ?? ''" (input)="setSeo('ogTitle', $any($event.target).value)" placeholder="Defaults to SEO title" />
    </div>

    <div class="settings-field">
      <label class="settings-label" for="set-og-desc">OG Description</label>
      <textarea id="set-og-desc" class="settings-textarea" [value]="page().seo?.ogDescription ?? ''" (input)="setSeo('ogDescription', $any($event.target).value)" rows="2" placeholder="Defaults to meta description"></textarea>
    </div>

    <div class="settings-field">
      <label class="settings-label" for="set-og-image">OG Image URL</label>
      <input id="set-og-image" type="url" [class]="inputClass" [value]="page().seo?.ogImage ?? ''" (input)="setSeo('ogImage', $any($event.target).value)" placeholder="https://… (recommended 1200×630)" />
    </div>
  </div>
</div>
