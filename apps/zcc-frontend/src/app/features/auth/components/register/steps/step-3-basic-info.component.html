<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      Basic Information
    </p>
    <h2 class="step__title">Tell us about yourself</h2>
    <p class="step__sub">This is the account owner&apos;s profile for your organization.</p>
  </header>

  <form [formRoot]="form">
    <div class="reg-form__body">
      <div class="field-grid">
        <app-form-input-control
          [formField]="form.firstName"
          label="First Name"
          placeholder="Alex"
          icon="user"
        />
        <app-form-input-control
          [formField]="form.lastName"
          label="Last Name"
          placeholder="Morgan"
          icon="user"
        />
      </div>

      <app-form-input-control
        [formField]="form.email"
        type="email"
        label="Work Email"
        placeholder="you@company.com"
        icon="email"
        [hint]="form.email().pending() ? 'Checking availability…' : ''"
      />

      <app-form-input-control
        [formField]="form.mobile"
        type="tel"
        label="Mobile Number"
        placeholder="+1 (555) 000-0000"
        icon="phone"
      />

      <div class="field-grid">
        <app-select-control
          [formField]="form.country"
          label="Country"
          placeholder="Select Country"
          icon="globe"
          [searchable]="true"
          searchPlaceholder="Search country..."
          [options]="countryOptions()"
        />

        <app-select-control
          [formField]="form.language"
          label="Language"
          placeholder="Select Language"
          icon="globe"
          [options]="languageOptions()"
        />

        <app-select-control
          [formField]="form.gender"
          label="Gender"
          placeholder="Select Gender"
          icon="user"
          [options]="genderOptions()"
        />
      </div>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button type="submit" class="btn-primary" [disabled]="store.loading() || form().submitting()">
        @if (store.loading()) {
          Saving…
        } @else {
          Continue
          <svg
            class="btn-primary__arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14"></path>
            <path d="M12 5l7 7-7 7"></path>
          </svg>
        }
      </button>
    </footer>
  </form>
</section>
