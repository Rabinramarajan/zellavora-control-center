<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 21h18"></path>
        <path d="M5 21V7l7-4 7 4v14"></path>
        <path d="M9 9h.01"></path>
        <path d="M9 12h.01"></path>
        <path d="M9 15h.01"></path>
        <path d="M15 9h.01"></path>
        <path d="M15 12h.01"></path>
        <path d="M15 15h.01"></path>
      </svg>
      Organization Information
    </p>
    <h2 class="step__title">Your company profile</h2>
    <p class="step__sub">Tell us about your organization.</p>
  </header>

  <form [formRoot]="form">
    <div class="reg-form__body">
      <app-form-input-control
        [formField]="form.organizationName"
        label="Organization Name"
        placeholder="e.g. Acme Corp"
        [hint]="form.organizationName().pending() ? 'Checking availability…' : ''"
      />

      <app-form-input-control
        [formField]="form.organizationCode"
        label="Organization Code"
        placeholder="e.g. acme-corp"
        [hint]="
          form.organizationCode().pending()
            ? 'Checking availability…'
            : '2–16 characters: letters, numbers, hyphens only.'
        "
      />
      <button
        type="button"
        class="text-link"
        [disabled]="!form.organizationName().value()"
        (click)="generateCodeFromName()"
      >
        Generate from organization name
      </button>

      <div class="field-grid">
        <app-select-control
          [formField]="form.industry"
          label="Industry"
          placeholder="Select Industry"
          icon="building"
          [options]="industryOptions"
        />

        <app-select-control
          [formField]="form.organizationSize"
          label="Company Size"
          placeholder="Select Size"
          icon="user"
          [options]="organizationSizeOptions"
        />
      </div>

      <div class="field-grid">
        <app-select-control
          [formField]="form.currency"
          label="Base Currency"
          placeholder="Select Currency"
          icon="list"
          [searchable]="true"
          searchPlaceholder="Search currency..."
          [options]="currencyOptions"
        />

        <app-select-control
          [formField]="form.fiscalYear"
          label="Fiscal Year"
          placeholder="Select Fiscal Year"
          icon="list"
          [options]="fiscalYearOptions"
        />
      </div>

      <app-select-control
        [formField]="form.timezone"
        label="Timezone"
        placeholder="Select Timezone"
        icon="globe"
        [searchable]="true"
        searchPlaceholder="Search timezone..."
        [options]="timezoneOptions"
      />

      <app-form-input-control
        [formField]="form.website"
        label="Website (optional)"
        placeholder="https://example.com"
      />

      <div class="field">
        <label class="field__label"
          >Organization Logo <span class="field__opt">(optional)</span></label
        >
        <app-drag-drop-upload (upload)="onLogoUploaded($event)"></app-drag-drop-upload>
      </div>

      <div class="field">
        <label class="field__label">What will you use Zellavora for?</label>
        <div class="use-grid">
          @for (u of useCaseOptions; track u.value) {
            <button
              type="button"
              class="use-chip"
              [class.is-active]="isUseCaseSelected(u.value)"
              (click)="toggleUseCase(u.value)"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path [attr.d]="icons[u.icon]"></path>
              </svg>
              {{ u.label }}
              @if (isUseCaseSelected(u.value)) {
                <span class="use-chip__check">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </span>
              }
            </button>
          }
        </div>
      </div>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-ghost" (click)="store.prevStep()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <button type="submit" class="btn-primary" [disabled]="store.loading() || form().submitting()">
        Continue
        <svg
          class="btn-primary__arrow"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </button>
    </footer>
  </form>
</section>
