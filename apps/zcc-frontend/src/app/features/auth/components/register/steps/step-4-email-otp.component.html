<section class="step">
  <header class="step__head">
    <p class="step__eyebrow">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"
        ></path>
        <path d="M22 6l-10 7L2 6"></path>
      </svg>
      Email Verification
    </p>
    <h2 class="step__title">Verify your email</h2>
    <p class="step__sub">
      We sent a 6-digit code to <strong class="step__em">{{ store.email() }}</strong>
    </p>
  </header>

  <div class="reg-form__body">
    <div class="otp-card">
      <div class="otp-card__mail">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"
          ></path>
          <path d="M22 6l-10 7L2 6"></path>
        </svg>
      </div>

      @if (!store.emailVerified()) {
        <button
          type="button"
          class="btn-primary btn-primary--block"
          [disabled]="store.loading()"
          (click)="sendEmailOtp()"
        >
          {{ store.loading() ? 'Sending…' : 'Send OTP Code' }}
        </button>
      }

      @if (store.emailVerified()) {
        <div class="success-chip">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          Email Verified
        </div>
      }

      @if (!store.emailVerified()) {
        <div class="otp-card__entry">
          <app-otp-input (otpChange)="emailOtpCodeInput.set($event)"></app-otp-input>

          <div class="otp-card__meta">
            <span class="otp-card__timer">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
              </svg>
              @if (emailTimer() > 0) {
                <span>{{ formatTimer(emailTimer()) }}</span>
              } @else {
                <span>Code expired</span>
              }
            </span>
            <button
              class="text-link"
              [disabled]="emailTimer() > 0 || store.loading()"
              (click)="resendEmailOtp()"
            >
              Resend code
            </button>
          </div>

          <button
            type="button"
            class="btn-primary btn-primary--block"
            [disabled]="emailOtpCodeInput().length !== 6 || store.loading()"
            (click)="verifyEmailOtp()"
          >
            {{ store.loading() ? 'Verifying…' : 'Verify Code' }}
            <svg
              class="btn-primary__arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14"></path>
              <path d="M12 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>
      }
    </div>
  </div>

  <footer class="form-actions">
    <button type="button" class="btn-ghost" (click)="store.prevStep()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
      Back
    </button>
  </footer>
</section>
