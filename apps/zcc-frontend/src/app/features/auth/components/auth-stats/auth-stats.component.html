<ul class="nx-stats" role="list" aria-label="Platform at a glance">
  @for (stat of stats; track stat.value) {
    <li class="nx-stats__item" [class.nx-stats__item--single]="!stat.label">
      <span class="nx-stats__icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @switch (stat.icon) {
            @case ('teams') {
              <circle cx="9" cy="8" r="3.1" />
              <path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5" />
              <path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.3c1.6.6 2.7 2.2 3 4.7" />
            }
            @case ('uptime') {
              <path d="M12 3.2 19 6v5.3c0 4.3-2.9 7.8-7 9-4.1-1.2-7-4.7-7-9V6z" />
              <path d="m9.2 12 2 2 3.6-3.8" />
            }
            @case ('globe') {
              <circle cx="12" cy="12" r="8.6" />
              <path d="M3.4 12h17.2" />
              <path d="M12 3.4c2.4 2.6 3.6 5.4 3.6 8.6s-1.2 6-3.6 8.6c-2.4-2.6-3.6-5.4-3.6-8.6S9.6 6 12 3.4z" />
            }
          }
        </svg>
      </span>
      <span class="nx-stats__text">
        <span class="nx-stats__value">{{ stat.value }}</span>
        @if (stat.label) {
          <span class="nx-stats__label">{{ stat.label }}</span>
        }
      </span>
    </li>
  }
</ul>
