<div class="nx-net__stage">
  <svg class="nx-net__lines" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
    <g class="nx-net__rings">
      @for (ring of rings; track ring.r) {
        <circle
          class="nx-net__ring"
          [class.nx-net__ring--reverse]="ring.reverse"
          cx="500"
          cy="480"
          [attr.r]="ring.r"
          [attr.stroke-dasharray]="ring.dash"
          [style.--nx-dur]="ring.dur + 's'"
        />
      }
    </g>

    <g class="nx-net__connectors">
      @for (link of connectors; track link.id) {
        <path class="nx-net__connector" [attr.d]="link.d" />
        <path
          class="nx-net__pulse nx-net__pulse--{{ link.id }}"
          [attr.d]="link.d"
          [style.--nx-delay]="link.delay + 's'"
        />
      }
    </g>

    <g class="nx-net__particles">
      @for (dot of particles; track $index) {
        <g
          class="nx-net__orbit"
          [style.--nx-dur]="dot.dur + 's'"
          [style.--nx-angle]="dot.angle + 'deg'"
          style="transform-origin: 500px 480px"
        >
          <circle
            class="nx-net__particle"
            [attr.cx]="500 + dot.r"
            cy="480"
            [attr.r]="dot.size"
          />
        </g>
      }
    </g>
  </svg>

  <div class="nx-net__hub">
    <span class="nx-net__hub-halo"></span>
    <app-nexus-logo size="lg" [wordmark]="false" [glow]="true" />
  </div>

  @for (node of nodes; track node.id) {
    <div
      class="nx-net__node nx-net__node--{{ node.id }}"
      [style.left.%]="node.x"
      [style.top.%]="node.y"
      [style.--nx-delay]="node.delay + 's'"
    >
      <span class="nx-net__node-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @switch (node.id) {
            @case ('organizations') {
              <circle cx="9" cy="8.5" r="2.6" />
              <circle cx="16.5" cy="9.5" r="2.1" />
              <path d="M3.5 19c.6-3 2.8-4.7 5.5-4.7s4.9 1.7 5.5 4.7" />
              <path d="M16 13.6c2.1.2 3.6 1.8 4 4" />
            }
            @case ('teams') {
              <circle cx="10" cy="8" r="3" />
              <path d="M4 19.5c.7-3.4 3-5.3 6-5.3s5.3 1.9 6 5.3" />
              <path d="M16.5 5.6a2.9 2.9 0 0 1 0 5.4" />
            }
            @case ('projects') {
              <path d="M3.5 7.5a2 2 0 0 1 2-2h3.2l1.8 2.2h6a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z" />
            }
            @case ('timesheets') {
              <circle cx="12" cy="12" r="8.2" />
              <path d="M12 7.2V12l3.2 2" />
            }
            @case ('invoices') {
              <path d="M6 3.5h8L18.5 8v12.5H6z" />
              <path d="M14 3.5V8h4.5" />
              <path d="M9 12.5h6M9 16h4" />
            }
          }
        </svg>
      </span>
      <span class="nx-net__node-label">{{ node.label }}</span>
    </div>
  }
</div>
