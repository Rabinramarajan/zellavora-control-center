---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: zellavora

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zellavora-backend
  namespace: zellavora
  labels:
    app: zellavora-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zellavora-backend
  template:
    metadata:
      labels:
        app: zellavora-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/zellavora/zellavora-control-center/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zellavora-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: zellavora-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: zellavora-secrets
              key: jwt-secret
        - name: API_URL
          value: "https://api.zellavora.com"
        - name: CORS_ORIGIN
          value: "https://zellavora.com"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zellavora-frontend
  namespace: zellavora
  labels:
    app: zellavora-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zellavora-frontend
  template:
    metadata:
      labels:
        app: zellavora-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/zellavora/zellavora-control-center/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "https://api.zellavora.com"
        - name: VITE_WS_URL
          value: "wss://api.zellavora.com"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: zellavora-backend-service
  namespace: zellavora
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: zellavora-backend

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: zellavora-frontend-service
  namespace: zellavora
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: zellavora-frontend

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zellavora-ingress
  namespace: zellavora
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - zellavora.com
    - api.zellavora.com
    secretName: zellavora-tls
  rules:
  - host: zellavora.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zellavora-frontend-service
            port:
              number: 80
  - host: api.zellavora.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zellavora-backend-service
            port:
              number: 3000

---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: zellavora-config
  namespace: zellavora
data:
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  FEATURE_MFA_ENABLED: "true"
  FEATURE_REAL_TIME_NOTIFICATIONS: "true"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: zellavora-secrets
  namespace: zellavora
type: Opaque
data:
  # Base64 encoded - replace with actual values
  database-url: cG9zdGdyZXM6Ly9tdXN0LWNoYW5nZS1pbS1wcm9k
  redis-url: cmVkaXM6Ly9tdXN0LWNoYW5nZS1pbS1wcm9k
  jwt-secret: bXVzdC1jaGFuZ2UtaW4tcHJvZA==

---
# Horizontal Pod Autoscaler for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zellavora-backend-hpa
  namespace: zellavora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zellavora-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Horizontal Pod Autoscaler for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zellavora-frontend-hpa
  namespace: zellavora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zellavora-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
