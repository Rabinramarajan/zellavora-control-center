name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Lint and type-check the backend
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix apps/backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Lint backend
        run: npm run lint

      - name: TypeScript check
        run: npm run type-check

  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix apps/backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Run backend tests
        run: npx jest --runInBand --forceExit --coverage --coverageReporters=lcov --coverageDirectory=../../coverage/backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
          REFRESH_TOKEN_SECRET: ci-only-refresh-secret-with-at-least-32-bytes

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/backend/lcov.info
          flags: backend
          fail_ci_if_error: false

  # Migrations and the API against a real Prisma client and Postgres engine (PGlite); no services needed
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix apps/backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Migration checks (empty and populated database)
        run: npm run e2e:migrations
        working-directory: apps/backend

      - name: End-to-end API checks
        run: npm run e2e
        working-directory: apps/backend

  # Build Backend
  build-backend:
    needs: [lint, backend-test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix apps/backend

      - name: Build backend
        run: npm run build
        working-directory: apps/backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
